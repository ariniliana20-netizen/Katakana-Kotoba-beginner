<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kana & Kotoba Master</title>
<style>
:root{--bg:#fff0f6;--card:#fff;--pk:#e8508a;--pk2:#fbc4d9;--tx:#3a2230;--ok:#2e9e6a;--no:#d6335a;--mu:#8a6577;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1620;--card:#3a1f2c;--pk:#f06fa2;--pk2:#5a2a40;--tx:#fbe6ef;--mu:#d3a2b8}}
:root[data-theme="dark"]{--bg:#2a1620;--card:#3a1f2c;--pk:#f06fa2;--pk2:#5a2a40;--tx:#fbe6ef;--mu:#d3a2b8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
main{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{color:var(--pk);font-size:1.5rem;margin:6px 0 2px;text-align:center}.sub{text-align:center;color:var(--mu);font-size:.9rem;margin-bottom:18px}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 4px 14px rgba(232,80,138,.15);margin-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
.mode{display:block;width:100%;text-align:left;border:2px solid var(--pk2);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mode b{color:var(--pk)}.mode small{display:block;color:var(--mu)}
.mode.sel{border-color:var(--pk);background:var(--pk2)}
.cnt{display:flex;gap:8px}.cnt button{flex:1;padding:10px 0;border-radius:12px;border:2px solid var(--pk2);background:var(--card)}
.cnt button.sel{background:var(--pk);color:#fff;border-color:var(--pk)}
.go{width:100%;background:var(--pk);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:1rem;margin-top:6px}
.go:disabled{opacity:.4}
.bar{height:8px;background:var(--pk2);border-radius:8px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--pk);width:0;transition:width .3s}
.top{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mu)}
.q{font-size:2.2rem;text-align:center;padding:14px 4px;line-height:1.4;font-weight:600;word-break:break-all}.q.s{font-size:1.35rem}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--pk2);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}.opt.no{background:var(--no);border-color:var(--no);color:#fff}
.hintb{background:none;border:0;color:var(--pk);font-weight:600;padding:4px 0}
.box{background:var(--pk2);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:.92rem}
.big{font-size:4rem;text-align:center;color:var(--pk);font-weight:800}.c{text-align:center}
.ghost{width:100%;background:none;border:2px solid var(--pk);color:var(--pk);border-radius:14px;padding:12px;margin-top:8px;font-weight:600}
</style></head><body><main id="app"></main>
<script>
const KT="ア a イ i ウ u エ e オ o カ ka キ ki ク ku ケ ke コ ko サ sa シ shi ス su セ se ソ so タ ta チ chi ツ tsu テ te ト to ナ na ニ ni ヌ nu ネ ne ノ no ハ ha ヒ hi フ fu ヘ he ホ ho マ ma ミ mi ム mu メ me モ mo ヤ ya ユ yu ヨ yo ラ ra リ ri ル ru レ re ロ ro ワ wa ヲ wo ン n ガ ga ギ gi グ gu ゲ ge ゴ go ザ za ジ ji ズ zu ゼ ze ゾ zo ダ da デ de ド do バ ba ビ bi ブ bu ベ be ボ bo パ pa ピ pi プ pu ペ pe ポ po".split(" ");
const H=c=>String.fromCharCode(c.charCodeAt(0)-0x60);
const BANK={kata:[],gai:[
["コンピューター","komputer","Dari 'computer'. Alat elektronik pengolah data."],
["スマートフォン","ponsel pintar","Dari 'smart phone'; sering disingkat スマホ."],
["インターネット","internet","Dari 'internet'."],
["パスワード","kata sandi","Dari 'password'. Dipakai saat login."],
["アルバイト","kerja paruh waktu","Dari bahasa Jerman 'Arbeit' (pekerjaan)."],
["コンビニ","minimarket 24 jam","Singkatan dari コンビニエンスストア (convenience store)."],
["レストラン","restoran","Dari 'restaurant'."],
["ホテル","hotel","Dari 'hotel'."],
["アイスクリーム","es krim","Dari 'ice cream'."],
["サラダ","salad","Dari 'salad'; hidangan sayur segar."],
["コーヒー","kopi","Dari 'coffee'; perhatikan tanda panjang ー."],
["ビール","bir","Dari bahasa Belanda 'bier'."],
["パン","roti","Dari bahasa Portugis 'pão'."],
["テレビ","televisi","Singkatan dari テレビジョン (television)."],
["エレベーター","lift","Dari 'elevator'."],
["タクシー","taksi","Dari 'taxi'."],
["スケジュール","jadwal","Dari 'schedule'."],
["ミーティング","rapat","Dari 'meeting'."],
["プレゼンテーション","presentasi","Dari 'presentation'; sering disingkat プレゼン."],
["メール","surel / email","Dari 'mail'."],
["ゲーム","permainan / game","Dari 'game'."],
["ニュース","berita","Dari 'news'."],
["ストレス","stres","Dari 'stress'."],
["アドバイス","saran","Dari 'advice'."],
["キャンセル","pembatalan","Dari 'cancel'."],
["サービス","layanan","Dari 'service'."],
["プロジェクト","proyek","Dari 'project'."],
["ダイエット","diet","Dari 'diet'; di Jepang umumnya berarti menurunkan berat badan."]],
koto:[
["締め切り","tenggat waktu","Dibaca しめきり. Dari 締める (menutup) + 切る (memotong)."],
["契約","kontrak","Dibaca けいやく. Sering muncul di dunia bisnis."],
["提案","usulan","Dibaca ていあん. 提 = mengajukan, 案 = rencana."],
["会議","rapat","Dibaca かいぎ. 会 = bertemu, 議 = berdiskusi."],
["研究","penelitian","Dibaca けんきゅう. Kata akademik umum."],
["論文","makalah ilmiah","Dibaca ろんぶん. 論 = argumen, 文 = tulisan."],
["経験","pengalaman","Dibaca けいけん."],
["責任","tanggung jawab","Dibaca せきにん."],
["残業","lembur","Dibaca ざんぎょう. 残 = sisa, 業 = pekerjaan."],
["転勤","dimutasi ke kantor lain","Dibaca てんきん. 転 = berpindah, 勤 = bekerja."],
["遠慮","sungkan / menahan diri","Dibaca えんりょ. Penting dalam etika sosial Jepang."],
["気配り","perhatian terhadap sekitar","Dibaca きくばり. 気 = perasaan, 配 = membagi."],
["挨拶","salam / sapaan","Dibaca あいさつ."],
["発表","pengumuman / presentasi","Dibaca はっぴょう."],
["環境","lingkungan","Dibaca かんきょう."],
["影響","pengaruh","Dibaca えいきょう."],
["傾向","kecenderungan","Dibaca けいこう."],
["予算","anggaran","Dibaca よさん. 予 = sebelumnya, 算 = menghitung."],
["面接","wawancara","Dibaca めんせつ. 面 = wajah, 接 = bertemu."],
["効率","efisiensi","Dibaca こうりつ."],
["苦労","kesusahan / jerih payah","Dibaca くろう."],
["約束","janji","Dibaca やくそく."]],
kal:[
["明日までに報告書を提出しなければなりません。","Saya harus mengumpulkan laporan sebelum besok.","～なければならない = harus. までに = batas waktu paling lambat."],
["雨が降りそうなので、傘を持っていきます。","Sepertinya akan hujan, jadi saya membawa payung.","～そうだ (penampakan) = tampaknya akan. ので = karena."],
["日本語を勉強すればするほど、面白くなります。","Semakin belajar bahasa Jepang, semakin menarik.","～ば～ほど = semakin ... semakin ..."],
["部長はもう帰られました。","Kepala bagian sudah pulang.","～(ら)れる = bentuk hormat (sonkei) untuk atasan."],
["試験に合格するために、毎日勉強しています。","Demi lulus ujian, saya belajar setiap hari.","～ために = tujuan (demi)."],
["彼女は歌がうまいだけでなく、ダンスも上手です。","Dia tidak hanya pandai menyanyi, tetapi juga pandai menari.","～だけでなく～も = tidak hanya ... tetapi juga ..."],
["忙しくても、運動するようにしています。","Meskipun sibuk, saya berusaha untuk tetap berolahraga.","～ようにする = berusaha membiasakan."],
["先生に宿題を直してもらいました。","Saya dibantu guru memperbaiki PR saya.","～てもらう = menerima tindakan dari orang lain."],
["「お先に失礼します。」","Permisi, saya pulang duluan.","Ungkapan sopan di kantor saat pulang lebih dulu."],
["「お待たせして申し訳ありません。」","Mohon maaf telah membuat Anda menunggu.","Ungkapan permintaan maaf formal."],
["「ご無理なさらないでください。」","Tolong jangan memaksakan diri.","ご～なさる = bentuk hormat; ～ないでください = tolong jangan."],
["彼が来るかどうか分かりません。","Saya tidak tahu apakah dia akan datang atau tidak.","～かどうか = apakah ... atau tidak."],
["時間があれば、一緒に行きませんか。","Kalau ada waktu, maukah pergi bersama?","～ば = bentuk kondisional; ませんか = ajakan."],
["電車が遅れたせいで、遅刻しました。","Karena kereta terlambat, saya jadi telat.","～せいで = akibat negatif (menyalahkan penyebab)."],
["この仕事は私にはできっこない。","Pekerjaan ini mustahil bisa saya lakukan.","～っこない = mustahil, pasti tidak bisa."]]};
KT.forEach((x,i)=>{if(i%2==0)BANK.kata.push([x,KT[i+1],"Hiragana pasangannya: "+H(x)])});
const MODES=[["kata","Hafalan Huruf Katakana Dasar","Tebak bacaan huruf Katakana"],["gai","Membaca Kata Serapan (Gairaigo)","Tebak arti kata serapan"],["koto","Kotoba Level Tinggi","Kosakata profesional & akademik"],["kal","Kalimat, Arti & Percakapan","Struktur kalimat & ungkapan situasional"]];
const A=document.getElementById("app");let S={mode:null,n:10};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function menu(){A.innerHTML=`<h1>🌸 Kana & Kotoba Master</h1><div class="sub">Latihan Katakana & kosakata lanjutan</div>
<div class="card"><b>1. Pilih mode</b><div style="margin-top:10px">${MODES.map(m=>`<button class="mode ${S.mode==m[0]?"sel":""}" onclick="S.mode='${m[0]}';menu()"><b>${m[1]}</b><small>${m[2]}</small></button>`).join("")}</div>
<b>2. Jumlah soal</b><div class="cnt" style="margin-top:10px">${[10,20,30,100].map(n=>`<button class="${S.n==n?"sel":""}" onclick="S.n=${n};menu()">${n}</button>`).join("")}</div></div>
<button class="go" ${S.mode?"":"disabled"} onclick="start()">Mulai Kuis</button>`}
function start(){const b=BANK[S.mode],n=Math.min(S.n,b.length);S.pool=b;S.qs=sh(b).slice(0,n);S.i=0;S.ok=0;S.note=n<S.n?`Bank soal mode ini berisi ${b.length} soal, jadi sesi memakai ${n} soal.`:"";show()}
function opts(q){const key=S.mode=="kata"?q[1]:q[1];const others=sh(S.pool.filter(x=>x[1]!==q[1]).map(x=>x[1]));const uniq=[...new Set(others)].slice(0,3);return sh([q[1],...uniq])}
function show(){const q=S.qs[S.i],o=opts(q),long=S.mode=="kal";S.done=false;
A.innerHTML=`<div class="top"><span>Soal ${S.i+1}/${S.qs.length}</span><span>Benar: ${S.ok}</span></div><div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
<div class="card"><div class="q ${long?"s":""}" lang="ja">${q[0]}</div><div class="c" style="color:var(--mu);font-size:.85rem">${S.mode=="kata"?"Bagaimana cara membacanya?":"Apa artinya?"}</div>
<button class="hintb" onclick="document.getElementById('h').style.display='block';this.remove()">💡 Lihat petunjuk</button><div id="h" class="box" style="display:none">${q[2]}</div></div>
${o.map((t,i)=>`<button class="opt" onclick="ans(this)">${t}</button>`).join("")}<div id="fb"></div>`}
function ans(el){if(S.done)return;S.done=true;const q=S.qs[S.i],right=el.textContent===q[1];if(right)S.ok++;
document.querySelectorAll(".opt").forEach(b=>{if(b.textContent===q[1])b.classList.add("ok");else if(b===el)b.classList.add("no")});
const last=S.i==S.qs.length-1;
document.getElementById("fb").innerHTML=`<div class="box"><b>${right?"✅ Benar!":"❌ Kurang tepat. Jawaban: "+q[1]}</b><br>Arti/konteks: ${q[1]}<br>${q[2]}</div><button class="go" onclick="next()">${last?"Lihat Skor":"Lanjut"}</button>`}
function next(){S.i++;S.i>=S.qs.length?result():show()}
function result(){const sc=Math.round(S.ok/S.qs.length*100);
A.innerHTML=`<h1>Hasil Akhir</h1><div class="card"><div class="big">${sc}</div><div class="c">dari 100</div><p class="c">${S.ok} benar dari ${S.qs.length} soal</p><p class="c">${sc>=80?"Luar biasa! 🌸":sc>=50?"Bagus, terus berlatih!":"Jangan menyerah, coba lagi!"}</p><p class="c" style="color:var(--mu);font-size:.85rem">${S.note}</p></div>
<button class="go" onclick="start()">Ulangi Mode Ini</button><button class="ghost" onclick="menu()">Kembali ke Menu</button>`}
menu();
</script></body></html>
